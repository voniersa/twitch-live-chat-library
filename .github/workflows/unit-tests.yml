name: Unit tests
on: [push]

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Run code sniffer
        run: make sniff
      - name: Run unit tests
        run: make test_unit
      - name: Upload artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests
          path: reports/phpunit.coverage.xml
          if-no-files-found: error
